<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Photo Markup</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#1d2227">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Markup">

<style>
:root{
  /* Layout: slim top bar, full-bleed canvas, tool panel pinned to the bottom. One dark world so annotation colors read on any photo. */
  --bg:#14171a; --panel:#1d2227; --raised:#262d33; --line:#2e353c;
  --ink:#eef2f5; --mute:#97a3ad; --accent:#5ac8fa; --on-accent:#06222e;
  --sans:-apple-system,system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.3 var(--sans);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.spacer{flex:1}
.btn{min-height:44px;min-width:44px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;border:1px solid var(--line);background:var(--raised);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.btn:disabled{opacity:.4}
.btn:focus-visible,.tool:focus-visible,.sw:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pick{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

#wrap{position:relative;flex:1;min-height:0;background:#0c0e10}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hint{position:absolute;left:12px;right:12px;top:10px;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:12px;background:rgba(20,23,26,.9);border:1px solid var(--line);font-size:13px}
#hint[hidden]{display:none}
#hint span{flex:1}
#tip,#toast{position:absolute;left:12px;right:12px;text-align:center;pointer-events:none;font-size:12px}
#tip{bottom:8px;color:#fff;text-shadow:0 1px 3px #000,0 0 6px #000}
#toast{bottom:40px}
#toast b{display:inline-block;padding:8px 14px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:600}
#toast[hidden]{display:none}

footer{display:flex;flex-direction:column;gap:8px;padding:8px 10px 10px;background:var(--panel);border-top:1px solid var(--line)}
.tools{display:flex;gap:4px;overflow-x:auto}
.tool{flex:1 0 40px;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 2px;border-radius:10px;border:0;background:transparent;color:var(--mute);font:600 11px var(--sans);cursor:pointer}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.swatches{display:flex;gap:6px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid #fff3;padding:0;cursor:pointer}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.acts{display:flex;gap:4px}
.acts .btn{padding:0;width:42px;min-width:42px}
.sliders{display:flex;gap:14px}
.sl{flex:1;display:flex;flex-direction:column;gap:2px;font-size:11px;font-weight:600;color:var(--mute)}
.sl input{width:100%;height:28px;margin:0;accent-color:var(--accent)}

.modal{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-start;justify-content:center;padding:max(12px,7%) 12px;background:rgba(0,0,0,.62)}
.modal[hidden]{display:none}
.card{width:100%;max-width:420px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.card h2{margin:0;font-size:17px;text-wrap:balance}
.card input[type=text]{width:100%;height:50px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#101316;color:var(--ink);font:600 18px var(--sans);-webkit-user-select:text;user-select:text}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-width:44px;min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--raised);color:var(--ink);font:600 16px var(--sans);cursor:pointer}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
#outimg{width:100%;max-height:60vh;object-fit:contain;border-radius:10px;background:#000;-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default}
.note{margin:0;color:var(--mute);font-size:14px}
.langsel{appearance:none;-webkit-appearance:none;min-width:56px;padding:0 10px;text-align:center;text-align-last:center}
.fab{position:absolute;right:12px;bottom:56px;padding:0;box-shadow:0 2px 10px rgba(0,0,0,.45)}
.fab[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
#cropBtn{right:64px}
body.cropping #cropBtn{display:none}
.cropbar{position:absolute;left:12px;right:68px;bottom:44px;display:flex;gap:8px}
.cropbar[hidden]{display:none}
.cropbar .btn{flex:1}
@media (prefers-reduced-motion:no-preference){.btn,.tool{transition:background .12s}}
</style>
</head>
<body>
<div id="app">
  <header>
    <label class="btn primary" for="file" id="pickBtn">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10.5" r="1.8"/><path d="M21 16l-5-5-8 8"/></svg>
      <span data-i18n="photo">Photo</span>
    </label>
    <input class="pick" type="file" id="file" accept="image/*">
    <span class="spacer"></span>
    <select class="btn langsel" id="lang" aria-label="Language" title="Language"><option value="en">EN</option><option value="ru">RU</option><option value="kk">KZ</option></select>
    <button class="btn" id="undo" type="button" data-i18n-aria="undo" aria-label="Undo" title="Undo"><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
    <button class="btn primary" id="save" type="button" data-i18n="save">Save</button>
  </header>

  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="hint">
      <span data-i18n="hint">This is a sample. Load your own photo from the gallery.</span>
      <label class="btn primary" for="file" style="min-height:40px" data-i18n="choose">Choose</label>
    </div>
    <div id="toast" hidden><b id="toastT"></b></div>
    <div id="tip"></div>
    <div class="cropbar" id="cropbar" hidden>
      <button class="btn" id="cropCancel" type="button" data-i18n="d_cancel">Cancel</button>
      <button class="btn primary" id="cropOk" type="button" data-i18n="c_apply">Apply</button>
    </div>
    <button class="btn fab" id="cropBtn" type="button" aria-pressed="false" data-i18n-aria="crop" aria-label="Crop" title="Crop"><svg class="i" viewBox="0 0 24 24"><path d="M6 2v14a2 2 0 002 2h14M2 6h14a2 2 0 012 2v14"/></svg></button>
    <button class="btn fab" id="fitBtn" type="button" data-i18n-aria="fit" aria-label="Fit to screen" title="Fit to screen"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>

  <footer>
    <div class="tools" role="toolbar" aria-label="Инструменты">
      <button class="tool" type="button" data-tool="select" aria-pressed="true"><svg class="i" viewBox="0 0 24 24"><path d="M6 3l12 8-5.5 1.5L9.5 19z"/></svg><span data-i18n="t_select">Select</span></button>
      <button class="tool" type="button" data-tool="arrow" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M5 19L19 5M19 5h-8M19 5v8"/></svg><span data-i18n="t_arrow">Arrow</span></button>
      <button class="tool" type="button" data-tool="dim" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M3 12h18M3 7v10M21 7v10M7 12l3-3M7 12l3 3M17 12l-3-3M17 12l-3 3"/></svg><span data-i18n="t_dim">Size</span></button>
      <button class="tool" type="button" data-tool="line" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M4 19L20 5"/></svg><span data-i18n="t_line">Line</span></button>
      <button class="tool" type="button" data-tool="rect" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1.5"/></svg><span data-i18n="t_rect">Box</span></button>
      <button class="tool" type="button" data-tool="ellipse" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="6.5"/></svg><span data-i18n="t_ellipse">Oval</span></button>
      <button class="tool" type="button" data-tool="text" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M5 7V5h14v2M12 5v14M9 19h6"/></svg><span data-i18n="t_text">Text</span></button>
      <button class="tool" type="button" data-tool="pen" aria-pressed="false"><svg class="i" viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/></svg><span data-i18n="t_pen">Draw</span></button>
    </div>

    <div class="row">
      <div class="swatches" role="group" aria-label="Цвет">
        <button class="sw" type="button" data-c="#ff3b30" style="background:#ff3b30" data-i18n-aria="c_red" aria-label="Red" aria-pressed="true"></button>
        <button class="sw" type="button" data-c="#ffd60a" style="background:#ffd60a" data-i18n-aria="c_yellow" aria-label="Yellow" aria-pressed="false"></button>
        <button class="sw" type="button" data-c="#30d158" style="background:#30d158" data-i18n-aria="c_green" aria-label="Green" aria-pressed="false"></button>
        <button class="sw" type="button" data-c="#0a84ff" style="background:#0a84ff" data-i18n-aria="c_blue" aria-label="Blue" aria-pressed="false"></button>
        <button class="sw" type="button" data-c="#ffffff" style="background:#ffffff" data-i18n-aria="c_white" aria-label="White" aria-pressed="false"></button>
        <button class="sw" type="button" data-c="#111111" style="background:#111111" data-i18n-aria="c_black" aria-label="Black" aria-pressed="false"></button>
      </div>
      <span class="spacer"></span>
      <div class="acts">
        <button class="btn" id="aText" type="button" data-i18n-aria="a_text" aria-label="Edit label" title="Edit label" disabled><svg class="i" viewBox="0 0 24 24"><path d="M4 18l4-12 4 12M5.5 14h5M15 18v-6a3 3 0 016 0v6M15 15h6"/></svg></button>
        <button class="btn" id="aDup" type="button" data-i18n-aria="a_dup" aria-label="Duplicate" title="Duplicate" disabled><svg class="i" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2"/></svg></button>
        <button class="btn" id="aDel" type="button" data-i18n-aria="a_del" aria-label="Delete" title="Delete" disabled><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
      </div>
    </div>

    <div class="sliders">
      <label class="sl"><span data-i18n="s_lw">Line width</span><input type="range" id="lw" min="2" max="24" value="7"></label>
      <label class="sl"><span data-i18n="s_fs">Text size</span><input type="range" id="fs" min="16" max="100" value="40"></label>
    </div>
  </footer>
</div>

<div class="modal" id="dlg" hidden>
  <form class="card" id="dform" autocomplete="off">
    <h2 id="dtitle">Label</h2>
    <input type="text" id="dinp" enterkeyhint="done" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-i18n-ph="ph" placeholder="e.g. 120 mm" data-i18n-aria="d_aria" aria-label="Label text">
    <div class="chips" id="chips">
      <button class="chip" type="button" data-u="u_mm" data-i18n="u_mm">mm</button>
      <button class="chip" type="button" data-u="u_cm" data-i18n="u_cm">cm</button>
      <button class="chip" type="button" data-u="u_m" data-i18n="u_m">m</button>
      <button class="chip" type="button" data-ch="Ø">Ø</button>
      <button class="chip" type="button" data-ch="°">°</button>
      <button class="chip" type="button" data-ch="±">±</button>
      <button class="chip" type="button" data-ch="×">×</button>
      <button class="chip" type="button" data-ch=" " data-i18n="space">space</button>
    </div>
    <div class="btns">
      <button class="btn primary" type="submit" data-i18n="d_ok">Done</button>
      <button class="btn" type="button" id="dclear" data-i18n="d_clear">Remove label</button>
      <button class="btn" type="button" id="dcancel" data-i18n="d_cancel">Cancel</button>
    </div>
  </form>
</div>

<div class="modal" id="out" hidden>
  <div class="card">
    <h2 data-i18n="o_title">Finished photo</h2>
    <img id="outimg" data-i18n-alt="o_alt" alt="Photo with markup">
    <p class="note" data-i18n="o_note">Press and hold the photo, then choose “Save to Photos”.</p>
    <div class="btns"><button class="btn primary" type="button" id="outclose" data-i18n="o_close">Close</button></div>
  </div>
</div>

  function startGesture() {
    const [a, b] = [...ptrs.values()];
    gesture = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, c: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, v: { ...view } };
    mode = null; draft = null; pendingSnap = null;
  }
  function updateGesture() {
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y) || 1, c = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    const s = clamp(gesture.v.s * d / gesture.d, fitS * 0.5, fitS * 14);
    const ix = (gesture.c.x - gesture.v.x) / gesture.v.s, iy = (gesture.c.y - gesture.v.y) / gesture.v.s;
    view.s = s; view.x = c.x - ix * s; view.y = c.y - iy * s; autoFit = false; req();
  }

  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    const p = pos(e); ptrs.set(e.pointerId, p);
    if (ptrs.size === 2) { startGesture(); req(); return; }
    if (ptrs.size > 2 || !base) return;
    const q = toImg(p);
    down = { p, moved: false };
    if (crop) {
      const h = cropHit(p);
      if (h) { mode = { k: 'cropH', h }; return; }
      if (q.x >= crop.x0 && q.x <= crop.x1 && q.y >= crop.y0 && q.y <= crop.y1) { mode = { k: 'cropM', last: q }; return; }
      mode = { k: 'pan', last: p }; return;
    }
    if (tool === 'select') {
      if (sel >= 0 && objs[sel]) {
        const hi = handleAt(objs[sel], q);
        if (hi >= 0) { pendingSnap = snapJSON(); mode = { k: 'handle', i: hi }; return; }
      }
      const idx = hitTest(q);
      if (idx >= 0) { sel = idx; pendingSnap = snapJSON(); mode = { k: 'move', last: q }; syncUI(); req(); return; }
      sel = -1; mode = { k: 'pan', last: p }; syncUI(); req(); return;
    }
    sel = -1; syncUI();
    if (tool === 'text') { mode = { k: 'text', q }; return; }
    draft = { t: tool, x1: q.x, y1: q.y, x2: q.x, y2: q.y, c: color, lw: lwv, fs: fsv, s: '' };
    if (tool === 'pen') draft.pts = [[q.x, q.y]];
    mode = { k: 'draw' }; req();
  });

  cv.addEventListener('pointermove', e => {
    if (!ptrs.has(e.pointerId)) return;
    const p = pos(e); ptrs.set(e.pointerId, p);
    if (ptrs.size === 2 && gesture) { updateGesture(); return; }
    if (!mode || !down) return;
    if (Math.hypot(p.x - down.p.x, p.y - down.p.y) > 6) down.moved = true;
    const q = toImg(p);
    if (mode.k === 'move' && down.moved) {
      commitSnap(); shift(objs[sel], q.x - mode.last.x, q.y - mode.last.y); mode.last = q;
    } else if (mode.k === 'handle' && down.moved) {
      commitSnap(); const o = objs[sel];
      if (mode.i === 0) { o.x1 = q.x; o.y1 = q.y; } else { o.x2 = q.x; o.y2 = q.y; }
    } else if (mode.k === 'cropH') {
      dragCrop(mode.h, q);
    } else if (mode.k === 'cropM') {
      moveCrop(q, mode);
    } else if (mode.k === 'pan') {
      view.x += p.x - mode.last.x; view.y += p.y - mode.last.y; mode.last = p; autoFit = false;
    } else if (mode.k === 'draw' && draft) {
      if (draft.t === 'pen') {
        const l = draft.pts[draft.pts.length - 1];
        if (Math.hypot(q.x - l[0], q.y - l[1]) * view.s > 2) draft.pts.push([q.x, q.y]);
      } else { draft.x2 = q.x; draft.y2 = q.y; }
    }
    req();
  });

  function endPointer(e, cancelled) {
    if (!ptrs.has(e.pointerId)) return;
    ptrs.delete(e.pointerId);
    if (gesture) { if (ptrs.size < 2) { gesture = null; mode = null; down = null; } req(); return; }
    const m = mode; mode = null;
    if (cancelled) { draft = null; req(); return; }
    if (m && m.k === 'draw' && draft) {
      const d = draft; draft = null;
      const len = Math.hypot(d.x2 - d.x1, d.y2 - d.y1) * view.s;
      const ok = d.t === 'pen' ? d.pts.length > 2 : len > 10;
      if (ok) {
        pushHist(snapJSON()); objs.push(d); sel = objs.length - 1;
        if (d.t === 'rect' || d.t === 'ellipse' || d.t === 'dim') openEdit(sel, true);
      }
    } else if (m && m.k === 'text' && down && !down.moved) {
      openNew(m.q);
    } else if (m && m.k === 'move' && down && !down.moved) {
      const now = Date.now();
      if (lastTap.i === sel && now - lastTap.t < 400 && objs[sel] && objs[sel].t !== 'pen') { lastTap = { t: 0, i: -1 }; openEdit(sel, false); }
      else lastTap = { t: now, i: sel };
    }
    pendingSnap = null; down = null; syncUI(); req();
  }
  cv.addEventListener('pointerup', e => endPointer(e, false));
  cv.addEventListener('pointercancel', e => endPointer(e, true));
  cv.addEventListener('wheel', e => { e.preventDefault(); zoomAt(pos(e), Math.exp(-e.deltaY * 0.002)); }, { passive: false });
  cv.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());

  /* ---------- text dialog ---------- */
  const inp = $('#dinp');
  function showDlg(title, val) {
    $('#dtitle').textContent = title; inp.value = val; $('#dlg').hidden = false;
    inp.focus(); inp.select();
  }
  function openEdit(i, fresh) {
    const o = objs[i]; if (!o || o.t === 'pen') return;
    dlg = { obj: o, isNew: false, fresh };
    showDlg(t('ti_' + o.t), o.s || '');
  }
  function openNew(q) {
    dlg = { obj: { t: 'text', x1: q.x, y1: q.y, x2: q.x, y2: q.y, c: color, lw: lwv, fs: fsv, s: '' }, isNew: true, fresh: false };
    showDlg(t('ti_text'), '');
  }
  function closeDlg() { $('#dlg').hidden = true; dlg = null; inp.blur(); syncUI(); req(); }
  function applyDlg(v) {
    if (!dlg) return;
    const o = dlg.obj;
    if (dlg.isNew) {
      if (v) { pushHist(snapJSON()); o.s = v; objs.push(o); sel = objs.length - 1; }
    } else if (v !== (o.s || '')) {
      if (!dlg.fresh) pushHist(snapJSON());
      o.s = v;
      if (o.t === 'text' && !v) { const i = objs.indexOf(o); if (i >= 0) objs.splice(i, 1); sel = -1; }
    }
  }
  $('#dform').addEventListener('submit', e => { e.preventDefault(); applyDlg(inp.value.trim()); closeDlg(); });
  $('#dclear').addEventListener('click', () => { applyDlg(''); closeDlg(); });
  $('#dcancel').addEventListener('click', closeDlg);
  $('#dlg').addEventListener('pointerdown', e => { if (e.target === $('#dlg')) closeDlg(); });
  function insertCh(ch) {
    const s = inp.selectionStart == null ? inp.value.length : inp.selectionStart, en = inp.selectionEnd == null ? s : inp.selectionEnd;
    inp.setRangeText(ch, s, en, 'end'); inp.focus();
  }
  const chipVal = b => b.dataset.u ? t(b.dataset.u) : b.dataset.ch;
  document.querySelectorAll('.chip').forEach(b => {
    b.addEventListener('touchstart', e => { e.preventDefault(); insertCh(chipVal(b)); }, { passive: false });
    b.addEventListener('mousedown', e => { e.preventDefault(); insertCh(chipVal(b)); });
    b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); insertCh(chipVal(b)); } });
  });

  /* ---------- controls ---------- */
  function syncUndo() { $('#undo').disabled = !hist.length; }
  function syncUI() {
    document.querySelectorAll('.tool').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tool === tool)));
    const o = sel >= 0 ? objs[sel] : null;
    if (o) { color = o.c; lwv = o.lw; fsv = o.fs; $('#lw').value = lwv; $('#fs').value = fsv; }
    document.querySelectorAll('.sw').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.c === color)));
    $('#aText').disabled = !o || o.t === 'pen';
    $('#aDup').disabled = !o; $('#aDel').disabled = !o;
    $('#tip').textContent = t('tip_' + tool);
    document.body.classList.toggle('cropping', tool === 'crop');
    $('#cropBtn').setAttribute('aria-pressed', String(tool === 'crop'));
    syncUndo();
  }
  document.querySelectorAll('.tool').forEach(b => b.addEventListener('click', () => {
    if (crop) { crop = null; $('#cropbar').hidden = true; }
    tool = b.dataset.tool; if (tool !== 'select') sel = -1; syncUI(); req();
  }));
  document.querySelectorAll('.sw').forEach(b => b.addEventListener('click', () => {
    color = b.dataset.c;
    if (sel >= 0 && objs[sel]) { pushHist(snapJSON()); objs[sel].c = color; }
    syncUI(); req();
  }));
  let styleSnapped = false;
  function onStyle() {
    lwv = +$('#lw').value; fsv = +$('#fs').value;
    if (sel >= 0 && objs[sel]) {
      if (!styleSnapped) { pushHist(snapJSON()); styleSnapped = true; syncUndo(); }
      objs[sel].lw = lwv; objs[sel].fs = fsv;
    }
    req();
  }
  ['lw', 'fs'].forEach(id => {
    $('#' + id).addEventListener('input', onStyle);
    $('#' + id).addEventListener('change', () => { styleSnapped = false; });
  });
  $('#aText').addEventListener('click', () => { if (sel >= 0) openEdit(sel, false); });
  $('#aDup').addEventListener('click', () => {
    if (sel < 0) return;
    pushHist(snapJSON());
    const c = JSON.parse(JSON.stringify(objs[sel])); shift(c, 30 * U, 30 * U);
    objs.push(c); sel = objs.length - 1; syncUI(); req();
  });
  $('#aDel').addEventListener('click', () => {
    if (sel < 0) return;
    pushHist(snapJSON()); objs.splice(sel, 1); sel = -1; syncUI(); req();
  });
  $('#undo').addEventListener('click', () => {
    if (!hist.length) return;
    const e = hist.pop();
    if (typeof e === 'string') objs = JSON.parse(e);
    else { objs = JSON.parse(e.j); base = e.base; W = e.W; H = e.H; fit(); }
    sel = -1; syncUI(); req();
  });
  $('#fitBtn').addEventListener('click', fit);
  $('#cropBtn').addEventListener('click', enterCrop);
  $('#cropOk').addEventListener('click', applyCrop);
  $('#cropCancel').addEventListener('click', exitCrop);

  /* ---------- export ---------- */
  function showOut(blob) {
    if (outUrl) URL.revokeObjectURL(outUrl);
    outUrl = URL.createObjectURL(blob); $('#outimg').src = outUrl; $('#out').hidden = false;
  }
  $('#outclose').addEventListener('click', () => { $('#out').hidden = true; });
  $('#save').addEventListener('click', () => {
    if (!base) return;
    const out = document.createElement('canvas'); out.width = W; out.height = H;
    const c = out.getContext('2d');
    c.drawImage(base, 0, 0); objs.forEach(o => drawObj(c, o));
    out.toBlob(async blob => {
      if (!blob) { toast(t('err_export')); return; }
      const d = new Date(), z = n => String(n).padStart(2, '0');
      const name = `markup-${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}.jpg`;
      if (dl) {
        try { await dl.save({ filename: name, data: blob }); toast(t('saved')); return; }
        catch (err) { if (err && err.code === 'declined') return; }
      }
      showOut(blob);
    }, 'image/jpeg', 0.92);
  });
  (async () => {
    try { if (window.claude && window.claude.use) dl = await window.claude.use('downloads'); } catch (_) { dl = null; }
  })();

  /* ---------- start ---------- */
  makeSample();
  applyLang();
  $('#lang').addEventListener('change', e => {
    lang = e.target.value;
    try { localStorage.setItem('pm-lang', lang); } catch (_) {}
    if (isSample && !hist.length) { makeSample(); sel = -1; }
    applyLang(); syncUI(); req();
  });
  syncUI();
  new ResizeObserver(resize).observe(wrap);
  resize();
})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
